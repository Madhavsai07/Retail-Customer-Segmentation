services:
  - type: web
    name: retailiq-backend
    runtime: python
    region: singapore        # change to your nearest region if preferred
    plan: free               # upgrade to paid for production workloads
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: SUPABASE_URL
        sync: false          # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # set to your Vercel/Netlify frontend URL
    healthCheckPath: /health
